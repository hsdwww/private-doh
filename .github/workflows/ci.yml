name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: go vet
        run: go vet ./...

      - name: unit tests
        run: go test ./...

      - name: race tests
        run: CGO_ENABLED=1 go test -race ./...
